name: pivot

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: runner
    restart: unless-stopped
    depends_on: [api]

  api:
    build:
      context: apps/api
      target: prod
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      STORAGE_DIR: /data/models
    volumes:
      - models:/data/models
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  proxy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on: [web, api]

  # Quick tunnel: public HTTPS URL for the phone (sensors need a secure context).
  # The api reads the hostname from the metrics endpoint (http://tunnel:2000/quicktunnel).
  # For a fixed URL use a named tunnel: see infra/docker-compose.named-tunnel.yml.
  tunnel:
    image: cloudflare/cloudflared:2026.11.2
    restart: unless-stopped
    command: tunnel --no-autoupdate --metrics 0.0.0.0:2000 --url http://proxy:80
    depends_on: [proxy]

volumes:
  models:
