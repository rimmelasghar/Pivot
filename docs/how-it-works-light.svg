<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1090 530" width="1090" height="530" role="img" aria-label="Pivot architecture: the phone reaches a Caddy proxy through a cloudflared tunnel, the laptop reaches it on localhost:8080; Caddy routes pages to the Next.js web app and /api and /ws to the FastAPI api, which relays phone orientation to the laptop through Redis pub/sub.">
<defs>
<marker id="a-ws" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#3D5AFE"/></marker>
<marker id="a-http" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7D818C"/></marker>
</defs>
<rect width="1090" height="530" rx="20" fill="#FFFFFF"/>
<g font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect x="290" y="20" width="780" height="430" rx="18" fill="none" stroke="#B9B5AC" stroke-width="1.5" stroke-dasharray="6 6"/>
<text x="1054" y="440" text-anchor="end" font-size="13" font-weight="600" fill="#4B4F5C" letter-spacing="0.06em">DOCKER COMPOSE</text>
<text x="40" y="40" font-size="13" font-weight="600" fill="#4B4F5C" letter-spacing="0.06em">DEVICES</text>
