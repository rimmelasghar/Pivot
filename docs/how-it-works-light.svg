<rect x="860" y="340" width="190" height="84" rx="14" fill="#F6F5F2" stroke="#D9D6CF" stroke-width="1.5"/>
<text x="878" y="376" font-size="17" font-weight="700" fill="#111318">Redis</text>
<text x="878" y="400" font-size="12.5" fill="#4B4F5C">sessions (TTL) · pub/sub</text>
<circle cx="230" cy="320" r="13" fill="#3D5AFE"/>
<text x="230" y="324.5" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">1</text>
<circle cx="230" cy="404" r="13" fill="#3D5AFE"/>
<text x="230" y="408.5" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">4</text>
<circle cx="230" cy="60" r="13" fill="#3D5AFE"/>
<text x="230" y="64.5" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">2</text>
<circle cx="1050" cy="190" r="13" fill="#3D5AFE"/>
<text x="1050" y="194.5" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">3</text>
<path d="M40 492 H76" stroke="#3D5AFE" stroke-width="2.5"/>
<text x="86" y="496.5" font-size="13" fill="#111318">Live WebSocket: phone orientation → api → Redis pub/sub → api → laptop, up to 60 messages/s</text>
<path d="M800 492 H836" stroke="#7D818C" stroke-width="2.5"/>
<text x="846" y="496.5" font-size="13" fill="#111318">HTTP only</text>
