<text x="268" y="92" text-anchor="middle" font-size="12.5" fill="#4B4F5C">HTTPS · WSS</text>
<path d="M500 102 H675 V186" fill="none" stroke="#3D5AFE" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a-ws)"/>
<text x="512" y="92" text-anchor="start" font-size="12.5" fill="#4B4F5C">proxy:80</text>
<path d="M230 362 H675 V278" fill="none" stroke="#3D5AFE" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a-ws)"/>
<text x="250" y="352" text-anchor="start" font-size="12.5" fill="#4B4F5C">http://localhost:8080</text>
<path d="M770 222 H815 V92 H856" fill="none" stroke="#7D818C" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a-http)"/>
<text x="837" y="82" text-anchor="middle" font-size="12.5" fill="#4B4F5C">pages</text>
<path d="M770 242 H856" fill="none" stroke="#3D5AFE" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a-ws)"/>
<text x="813" y="234" text-anchor="middle" font-size="12.5" fill="#4B4F5C">/api · /ws</text>
<path d="M955 278 V336" fill="none" stroke="#3D5AFE" stroke-width="2.5" stroke-linejoin="round" marker-start="url(#a-ws)" marker-end="url(#a-ws)"/>
<text x="965" y="312" text-anchor="start" font-size="12.5" fill="#4B4F5C">pub/sub</text>
<rect x="40" y="60" width="190" height="84" rx="14" fill="#F6F5F2" stroke="#D9D6CF" stroke-width="1.5"/>
<text x="58" y="96" font-size="17" font-weight="700" fill="#111318">Phone</text>
<text x="58" y="120" font-size="12.5" fill="#4B4F5C">/c/{id} · reads motion sensors</text>
<rect x="40" y="320" width="190" height="84" rx="14" fill="#F6F5F2" stroke="#D9D6CF" stroke-width="1.5"/>
<text x="58" y="356" font-size="17" font-weight="700" fill="#111318">Laptop</text>
<text x="58" y="380" font-size="12.5" fill="#4B4F5C">/ · uploads + renders model</text>
<rect x="310" y="60" width="190" height="84" rx="14" fill="#F6F5F2" stroke="#D9D6CF" stroke-width="1.5"/>
<text x="328" y="96" font-size="17" font-weight="700" fill="#111318">cloudflared</text>
<text x="328" y="120" font-size="12.5" fill="#4B4F5C">public HTTPS URL</text>
<rect x="580" y="190" width="190" height="84" rx="14" fill="#F6F5F2" stroke="#D9D6CF" stroke-width="1.5"/>
<text x="598" y="226" font-size="17" font-weight="700" fill="#111318">Caddy proxy</text>
<text x="598" y="250" font-size="12.5" fill="#4B4F5C">:8080 · single origin</text>
<rect x="860" y="50" width="190" height="84" rx="14" fill="#F6F5F2" stroke="#D9D6CF" stroke-width="1.5"/>
